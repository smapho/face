<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>顔登録 | 顔認証 出退勤システム</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>顔を登録する</h1>
    <p>名前を入力し、カメラに顔を映して登録してください</p>
  </header>

  <div class="card">
    <input type="text" id="nameInput" placeholder="氏名を入力" autocomplete="off" />
    <div class="video-wrap">
      <video id="video" muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <button id="registerBtn" class="btn-primary" disabled>この顔を登録する</button>
    <div id="status" class="status">モデルを読み込み中です...</div>
  </div>

  <div class="nav-links">
    <a href="index.html">← トップに戻る</a>
    <a href="attendance.html">出退勤を打刻する →</a>
  </div>

  <script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/faceEngine.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
