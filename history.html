<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>出退勤一覧 | 顔認証 出退勤システム</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .card.wide { max-width: 820px; }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 12px 0 4px;
  }
  .arrow-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .arrow-btn:hover { background: #334155; }
  .date-display { text-align: center; min-width: 220px; }
  .big-date { font-size: 1.9rem; font-weight: 700; color: #f1f5f9; line-height: 1.2; }
  .big-date.sunday, .big-date.holiday { color: #f87171; }
  .big-date.saturday { color: #60a5fa; }
  .big-weekday { font-size: 1rem; color: #94a3b8; margin-top: 2px; }
  .big-holiday { font-size: 0.85rem; color: #f87171; margin-top: 4px; min-height: 1.1em; }
  #logTableBody td.date-cell.sunday, #logTableBody td.date-cell.holiday { color: #f87171; }
  #logTableBody td.date-cell.saturday { color: #60a5fa; }
  .date-sub-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .date-sub-controls input[type="date"] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
  }
  .date-sub-controls button {
    width: auto;
    padding: 8px 14px;
    margin-bottom: 0;
    font-size: 0.85rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 600; background: #0f172a; }
  #logTableBody td.date-cell { color: #94a3b8; white-space: nowrap; }
  #logTableBody td.name-cell { font-weight: 600; }
  #logTableBody td.time-cell { text-align: center; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .badge.in { background: #14532d; color: #bbf7d0; }
  .badge.out { background: #334155; color: #cbd5e1; }
  .badge.break-start { background: #78350f; color: #fed7aa; }
  .badge.break-end { background: #1e3a8a; color: #bfdbfe; }
  .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .status-card { background: #0f172a; border-radius: 10px; padding: 12px; }
  .status-card .name { font-weight: 600; margin-bottom: 4px; }
  .status-card .time { color: #64748b; font-size: 0.75rem; margin-top: 4px; }
  .table-wrap { max-height: 420px; overflow-y: auto; }
  #logTableBody td.name-cell { cursor: pointer; }
  #logTableBody td.name-cell:hover { text-decoration: underline; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: #1e293b;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #334155;
    color: #e2e8f0;
    font-size: 1.1rem;
    cursor: pointer;
    margin: 0;
  }
  .modal-title { margin: 0 0 8px; padding-right: 32px; }
  .modal-month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .modal-month-nav .arrow-btn { width: 36px; height: 36px; font-size: 1.2rem; }
  .modal-month-label { font-weight: 600; min-width: 100px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>出退勤一覧</h1>
    <div class="date-nav">
      <button id="prevDayBtn" class="arrow-btn" aria-label="前の日">‹</button>
      <div class="date-display">
        <div id="bigDate" class="big-date">-</div>
        <div id="bigWeekday" class="big-weekday">-</div>
        <div id="bigHoliday" class="big-holiday"></div>
      </div>
      <button id="nextDayBtn" class="arrow-btn" aria-label="次の日">›</button>
    </div>
    <div class="date-sub-controls">
      <input type="date" id="dateFilter" />
      <button id="todayBtn" class="btn-secondary">今日</button>
      <button id="allBtn" class="btn-secondary">全期間</button>
    </div>
  </header>

  <div class="card wide">
    <h3 style="margin-top:0;">現在の状況</h3>
    <div id="statusGrid" class="status-grid">読み込み中...</div>

    <h3>打刻履歴</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>日付</th><th>氏名</th><th>出社</th><th>中抜</th><th>戻り</th><th>退社</th></tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="6">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="nav-links">
    <a href="index.html">← トップに戻る</a>
    <a href="attendance.html">打刻する →</a>
  </div>

  <div id="employeeModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <button id="modalCloseBtn" class="modal-close" aria-label="閉じる">×</button>
      <h3 id="modalTitle" class="modal-title">-</h3>
      <div class="modal-month-nav">
        <button id="modalPrevMonthBtn" class="arrow-btn" aria-label="前の月">‹</button>
        <span id="modalMonthLabel" class="modal-month-label">-</span>
        <button id="modalNextMonthBtn" class="arrow-btn" aria-label="次の月">›</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>日付</th><th>出社</th><th>中抜</th><th>戻り</th><th>退社</th></tr>
          </thead>
          <tbody id="modalTableBody">
            <tr><td colspan="5">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="/api/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
