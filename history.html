<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>出退勤一覧 | 顔認証 出退勤システム</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .card.wide { max-width: 820px; }
  .filter-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .filter-row input[type="date"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 600; background: #0f172a; }
  #logTableBody td.date-cell { color: #94a3b8; white-space: nowrap; }
  #logTableBody td.name-cell { font-weight: 600; }
  #logTableBody td.time-cell { text-align: center; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .badge.in { background: #14532d; color: #bbf7d0; }
  .badge.out { background: #334155; color: #cbd5e1; }
  .badge.break-start { background: #78350f; color: #fed7aa; }
  .badge.break-end { background: #1e3a8a; color: #bfdbfe; }
  .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .status-card { background: #0f172a; border-radius: 10px; padding: 12px; }
  .status-card .name { font-weight: 600; margin-bottom: 4px; }
  .status-card .time { color: #64748b; font-size: 0.75rem; margin-top: 4px; }
  .table-wrap { max-height: 420px; overflow-y: auto; }
</style>
</head>
<body>
  <header>
    <h1>出退勤一覧</h1>
    <p>現在の在席状況と打刻履歴を確認できます</p>
  </header>

  <div class="card wide">
    <h3 style="margin-top:0;">現在の状況</h3>
    <div id="statusGrid" class="status-grid">読み込み中...</div>

    <h3>打刻履歴</h3>
    <div class="filter-row">
      <input type="date" id="dateFilter" />
      <button id="todayBtn" class="btn-secondary" style="width:auto; padding:10px 16px; margin-bottom:0;">今日</button>
      <button id="allBtn" class="btn-secondary" style="width:auto; padding:10px 16px; margin-bottom:0;">全期間</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>日付</th><th>氏名</th><th>出社</th><th>中抜</th><th>戻り</th><th>退社</th></tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="6">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="nav-links">
    <a href="index.html">← トップに戻る</a>
    <a href="attendance.html">打刻する →</a>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="/api/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
